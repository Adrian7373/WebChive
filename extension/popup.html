<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            width: 320px;
            padding: 16px;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #171717;
            color: #E5E5E5;
            margin: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-size: 13px;
            color: #A3A3A3;
        }

        input {
            background-color: #1C1C1E;
            border: 1px solid #333;
            color: #E5E5E5;
            padding: 10px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #555;
        }

        button {
            background-color: #4B5563;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #6B7280;
        }

        button:disabled {
            background-color: #374151;
            cursor: not-allowed;
        }

        #status {
            font-size: 13px;
            text-align: center;
            height: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <label for="tags">Tags (comma-separated)</label>
        <input type="text" id="tags" placeholder="e.g. node, architecture, reference" autocomplete="off" />
        <button id="saveBtn">Archive Article</button>
        <div id="status"></div>
    </div>

    <script src="popup.js" defer></script>
</body>

</html>
